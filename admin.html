<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Panel — Mangalam Motor Car Bazar</title><link rel="icon" href="favicon.png"><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:#f1f4fa;color:#1d2433}a{color:#1b2d5c}
#lg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px}#lg form{background:#fff;padding:28px;width:min(380px,100%);box-shadow:0 8px 30px #0002;border-radius:14px;border-top:5px solid #f47a28}#lg img{display:block;max-width:90px;max-height:90px;object-fit:contain;margin:0 auto 14px}#lg label{font-weight:600;display:block;margin:12px 0 4px}#lg input{width:100%;padding:11px;border:1px solid #c4cce0;border-radius:8px;font-size:16px}
.b{background:#f47a28;color:#fff;border:0;padding:10px 16px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700;text-decoration:none;display:inline-block}.b:hover{background:#d9651a}.b.r{background:#d63638;color:#fff}.b.g{background:#fff;color:#1b2d5c;border:1px solid #1b2d5c}.err{color:#d63638;margin-top:10px;min-height:20px}
#app{display:none}#top{white-space:nowrap;font-size:13px;gap:8px;position:fixed;top:0;left:0;right:0;height:46px;background:#101c3d;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:5}#top a{color:#ffb27a;text-decoration:none;margin-left:10px}#top b{overflow:hidden;text-overflow:ellipsis}
#side{position:fixed;top:46px;bottom:0;left:0;width:210px;background:#1b2d5c;padding-top:8px;z-index:4;overflow:auto}#side a{display:block;padding:12px 16px;color:#d6def5;text-decoration:none;cursor:pointer}#side a:hover{background:#26397a;color:#fff}#side a.on{background:#f47a28;color:#fff;font-weight:700}
#main{margin:46px 0 0 210px;padding:22px;max-width:980px}h1{font-weight:600;font-size:22px;margin:0 0 16px}h3{margin:22px 0 4px;color:#1b2d5c}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}.box{background:#fff;border:1px solid #d5dbea;padding:16px;border-radius:10px;margin-bottom:14px}.box b.n{font-size:28px;display:block}
table{width:100%;background:#fff;border:1px solid #d5dbea;border-collapse:collapse;border-radius:10px;overflow:hidden}td,th{padding:11px 12px;text-align:left;border-bottom:1px solid #e6eaf5}th{background:#e9eefb}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}.mg div{background:#fff;border:1px solid #d5dbea;padding:6px;border-radius:8px}.mg img{width:100%;height:100px;object-fit:cover;display:block;border-radius:4px}.mg small{display:block;margin:6px 0;word-break:break-all;color:#5c6a8c;font-size:11px}
label.f{display:block;font-weight:600;margin:12px 0 4px}input.f,textarea.f,select.f{width:100%;padding:10px;border:1px solid #c4cce0;border-radius:8px;font-size:15px;background:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.qr{width:180px;max-width:100%;display:block;margin:8px 0;border:1px solid #d5dbea;border-radius:10px;background:#fff;padding:6px}.hint{color:#5c6a8c;font-size:12.5px;margin:3px 0 0}
#ed{position:fixed;top:46px;left:210px;right:0;bottom:0;background:#fff;display:none;z-index:6}#ed iframe{width:100%;height:100%;border:0}
@media(max-width:780px){#side{width:100%;height:auto;bottom:auto;display:flex;overflow-x:auto;top:46px;padding:0}#side a{white-space:nowrap;padding:12px 14px}#main{margin:96px 0 0;padding:14px}#ed{left:0;top:46px}.row2{grid-template-columns:1fr}td,th{padding:9px 7px;font-size:13px}}
</style></head><body>
<div id="lg"><form id="lf"><img src="images/mangalam-logo.png" alt=""><h2 style="text-align:center;margin:0 0 6px">Admin Login</h2><label>Email</label><input type="email" id="em" required autocomplete="username"><label>Password</label><input type="password" id="pw" required autocomplete="current-password"><div class="err" id="er"></div><button class="b" style="width:100%;padding:12px">Log In</button><p style="text-align:center;margin:14px 0 0"><a href="index.html">← Website par wapas</a></p></form></div>
<div id="app"><div id="top"><b>🚗 Mangalam Motor Car Bazar — Admin</b><span><a href="index.html" target="_blank">Visit Site</a><a href="#" id="lo">Log Out</a></span></div>
<div id="side"><a data-v="dash" class="on">📊 Dashboard</a><a data-v="pages">📄 Pages (Edit)</a><a data-v="site">🔗 Contact &amp; Home Banner</a><a data-v="media">🖼 Media Library</a><a data-v="set">⚙️ GitHub Settings</a></div>
<div id="main"></div><div id="ed"><iframe id="fr"></iframe></div></div>
<script src="cms-core.js"></script><script>
var P=[['index','Home Page','index.html'],['cars','Cars','cars.html'],['finance','Finance','finance.html'],['sell','Sell Your Car','sell.html'],['gallery','Gallery','gallery.html'],['contact','Contact Us','contact.html']];
var DEF={phone:'7068306702',whatsapp:'917068306702',email:'ravirairavi2026@gmail.com',address:'NH28, Nedula Chauraha, Khalilabad, Sant Kabir Nagar, Uttar Pradesh 272175',hero:['images/mangalam-car-07.jpeg','images/mangalam-car-08.jpeg','images/mangalam-car-03.jpeg','images/mangalam-car-01.jpeg']};
function shrink(f,cb){var i=new Image(),u=URL.createObjectURL(f);i.onload=function(){var s=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.85))};i.onerror=function(){alert('Image padh nahi payi')};i.src=u}
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function boot(){$('lg').style.display='none';$('app').style.display='block';view('dash')}
api('/api/me').then(boot).catch(function(){});
$('lf').onsubmit=function(e){e.preventDefault();$('er').textContent='';api('/api/login',{method:'POST',body:JSON.stringify({email:$('em').value,password:$('pw').value})}).then(boot).catch(function(x){$('er').textContent=x.error||'Login fail'})};
$('lo').onclick=function(e){e.preventDefault();api('/api/logout',{method:'POST'}).then(function(){location.href='index.html'})};
document.querySelectorAll('#side a').forEach(function(a){a.onclick=function(){view(a.dataset.v)}});
window.addEventListener('message',function(e){if(e.data=='cms-exit'){$('ed').style.display='none';$('fr').src='about:blank';view('pages')}});
function edit(i){$('fr').src=P[i][2]+'?edit=1&t='+Date.now();$('ed').style.display='block'}
function S0(){var s={};try{s=JSON.parse(localStorage.getItem('mm_settings'))||{}}catch(e){}return s}
function msg(r){alert(r.local?'Saved ✔ — abhi sirf is browser me dikhega. Sabko live dikhane ke liye GitHub Settings connect karein.':'Saved ✔ GitHub par gaya, ~1 minute me live site par dikhega.')}
function ov(h){var o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:#000b;z-index:50;overflow:auto;padding:4vh 10px';o.innerHTML='<div style="background:#fff;max-width:760px;margin:auto;padding:18px;border-radius:10px">'+h+'</div>';document.body.appendChild(o);return o}
function pickMedia(cb){var o=ov('<b>Image chunein</b> <label class="b" style="float:right">⬆ Nayi upload<input type="file" accept="image/*" hidden id="pf"></label><div class="mg" id="pg" style="margin-top:14px;clear:both">Loading...</div><p><button class="b g" id="pc">Close</button></p>');
o.querySelector('#pc').onclick=function(){o.remove()};o.querySelector('#pf').onchange=function(){var f=this.files[0];if(!f)return;shrink(f,function(d){api('/api/upload',{method:'POST',body:JSON.stringify({name:f.name,data:d})}).then(function(j){o.remove();cb(j.url)}).catch(function(e){alert(e.error)})})};
api('/api/media').then(function(l){var g=o.querySelector('#pg');g.innerHTML=l.map(function(x){return'<div style="cursor:pointer"><img loading="lazy" src="'+esc(CMS.prev[x.url]||CMS.abs(x.url))+'"></div>'}).join('');[].forEach.call(g.children,function(c,i){c.onclick=function(){o.remove();cb(l[i].url)}})})}
function view(v){document.querySelectorAll('#side a').forEach(function(a){a.classList.toggle('on',a.dataset.v==v)});var m=$('main');if(v=='site')return siteView(m);
 if(v=='dash'){Promise.all([api('/api/pages'),api('/api/media')]).then(function(r){m.innerHTML='<h1>Dashboard</h1><div class="cards"><div class="box"><b class="n">'+P.length+'</b>Total Pages</div><div class="box"><b class="n">'+r[0].length+'</b>Pages edited by you</div><div class="box"><b class="n">'+r[1].length+'</b>Images in library</div></div><div class="box"><b>Kaise use karein</b><br>📄 <b>Pages</b> → kisi page par <b>Edit</b> → text par click karke likhein; kisi cheez par click karke use <b>Delete / Duplicate / Move / Change Image / Link</b> karein, <b>➕ Text / ➕ Image</b> se nayi cheez jodein → <b>Save</b>. (Car card badalne ke liye Cars page kholein.)<br>🔗 <b>Contact &amp; Home Banner</b> → phone, WhatsApp, email, address aur home page ke 4 banner photos badlein.<br>⚙️ <b>GitHub Settings</b> → ek baar connect karein taaki changes sabko live dikhein.</div><p><button class="b" onclick="view(\'pages\')">Pages Edit Karein</button> <button class="b g" onclick="view(\'site\')">Contact &amp; Banner</button></p>'})}
 else if(v=='pages'){api('/api/pages').then(function(r){var u={};r.forEach(function(x){u[x.page]=x.updated});m.innerHTML='<h1>Pages</h1><table><tr><th>Page</th><th>Status</th><th>Actions</th></tr>'+P.map(function(p,i){return'<tr><td><b>'+p[1]+'</b></td><td>'+(u[p[0]]?'Edited '+new Date(u[p[0]]).toLocaleString():'Original')+'</td><td><button class="b" onclick="edit('+i+')">✏️ Edit</button> <a class="b g" href="'+p[2]+'" target="_blank">View</a></td></tr>'}).join('')+'</table>'})}
 else if(v=='set'){var c=CMS.cfg()||{};m.innerHTML='<h1>GitHub Settings — sabko live dikhane ke liye</h1><div class="box"><p>Jab tak GitHub connect nahi hai, edits <b>sirf is browser</b> me dikhenge. Connect karne ke baad Save par changes aapke GitHub repo me jayenge aur hosting (Vercel/Netlify/GitHub Pages) unhe <b>sabke liye live</b> kar degi (~1 min).</p><p><b>Token kaise banayein:</b> GitHub → Settings → Developer settings → Personal access tokens → Fine-grained → apni repo chunein → Permissions: <b>Contents = Read and write</b>.</p><label class="f">Repo (username/repo-name)</label><input class="f" id="g1" value="'+esc(c.repo||'')+'"><label class="f">GitHub Token</label><input class="f" id="g2" type="password" value="'+esc(c.token||'')+'"><p><button class="b" id="gs">Test &amp; Save</button> <button class="b r" id="gx">Disconnect</button></p><div id="gm"></div></div>';$('gs').onclick=function(){var cfg={repo:$('g1').value.trim(),token:$('g2').value.trim(),branch:'main'};localStorage.setItem('mm_gh',JSON.stringify(cfg));CMS.gh('').then(function(r){if(!r)throw{error:'Repo nahi mili'};cfg.branch=r.default_branch;localStorage.setItem('mm_gh',JSON.stringify(cfg));$('gm').innerHTML='✅ Connected: '+esc(r.full_name)+' (branch '+esc(r.default_branch)+')'}).catch(function(x){localStorage.removeItem('mm_gh');$('gm').innerHTML='❌ '+esc(x.error||'Fail')})};$('gx').onclick=function(){localStorage.removeItem('mm_gh');view('set')}}
 else{m.innerHTML='<h1>Media Library</h1><p><label class="b">⬆ Image Upload karein<input type="file" id="mf" accept="image/*" multiple hidden></label></p><div class="mg" id="mg">Loading...</div>';$('mf').onchange=function(){Promise.all([].map.call(this.files,function(f){return new Promise(function(ok){shrink(f,function(data){api('/api/upload',{method:'POST',body:JSON.stringify({name:f.name,data:data})}).then(ok).catch(function(e){alert(e.error);ok()})})})})).then(function(){view('media')})};
 api('/api/media').then(function(l){$('mg').innerHTML=l.map(function(x){return'<div><img src="'+esc(CMS.abs(x.url))+'" loading="lazy"><small>'+esc(x.url)+'</small>'+(x.up?'<button class="b r" onclick="delImg(\''+esc(x.url.split('/').pop())+'\')">Delete</button>':'')+'</div>'}).join('')})}}
function delImg(f){if(confirm('Ye image delete karein?'))api('/api/media?f='+encodeURIComponent(f),{method:'DELETE'}).then(function(){view('media')})}
function siteView(m){var s0=S0(),S=JSON.parse(JSON.stringify(Object.assign({},DEF,s0)));S.hero=(s0.hero&&s0.hero.length==4)?s0.hero:DEF.hero.slice();
 var I=function(id,l,v,h,t){return'<label class="f">'+l+'</label><input class="f" id="'+id+'" value="'+esc(v)+'"'+(t?' type="'+t+'"':'')+'>'+(h?'<div class="hint">'+h+'</div>':'')};
 var hero=S.hero;
 m.innerHTML='<h1>Contact &amp; Home Banner</h1>'
 +'<div class="box"><h3 style="margin-top:0">📞 Contact Details</h3><div class="hint">Yahan badalte hi poori site (header, contact, buttons, WhatsApp) me naya number/email/address aa jayega.</div><div class="row2">'+I('s_p1','Phone Number (10 digit)',S.phone,'Call buttons aur Contact page isse chalenge')+I('s_wa','WhatsApp Number (91 ke saath)',S.whatsapp,'Saare WhatsApp buttons aur forms isse chalenge')+I('s_em','Email',S.email,'','email')+'</div><label class="f">Address</label><textarea class="f" id="s_ad" rows="3">'+esc(S.address)+'</textarea></div>'
 +'<div class="box"><h3 style="margin-top:0">🏞 Home Page Banner — 4 Photos</h3><div class="hint">Home page ke upar ka slideshow. Har photo ke neeche "Image badlein" dabayein.</div><div class="row2">'+hero.map(function(u,i){return'<div><b>Photo '+(i+1)+'</b><img class="qr" id="h'+i+'" src="'+esc(CMS.abs(u))+'" style="width:220px" onerror="this.style.opacity=.3"><button class="b g" data-hi="'+i+'">🖼 Image badlein</button></div>'}).join('')+'</div></div>'
 +'<p><button class="b" id="ss" style="padding:12px 26px;font-size:15px">💾 Save All</button> <button class="b g" id="sr">Sab Original par wapas</button></p>';
 m.querySelectorAll('[data-hi]').forEach(function(b){b.onclick=function(){var i=+b.dataset.hi;pickMedia(function(u){hero[i]=u;$('h'+i).src=CMS.prev[u]||CMS.abs(u);$('h'+i).style.opacity=1})}});
 $('sr').onclick=function(){if(confirm('Saari settings (contact + banner) original par wapas karein?'))CMS.saveSettings({}).then(function(r){msg(r);siteView(m)}).catch(function(x){alert(x.error)})};
 $('ss').onclick=function(){var g=function(i){return $(i).value.trim()};
  CMS.saveSettings({phone:g('s_p1'),whatsapp:g('s_wa'),email:g('s_em'),address:g('s_ad'),hero:hero}).then(msg).catch(function(x){alert(x.error)})}}
</script></body></html>
